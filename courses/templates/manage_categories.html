{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<h2>📂 Manage Categories</h2>

<form method="POST">
{% csrf_token %}
{{ form.as_p }}

<button class="btn btn-primary">Add Category</button>
</form>

<hr>

<h4>Categories List</h4>

<table class="table table-striped">

<tr>
<th>ID</th>
<th>Name</th>
</tr>

{% for category in categories %}
<tr>
<td>{{ category.id }}</td>
<td>{{ category.name }}</td>
</tr>
{% endfor %}

</table>

</div>

{% endblock %}
